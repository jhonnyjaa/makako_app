# Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/icon.png" # 1024x1024, fondo blanco (iOS + Android legacy)

  android: "launcher_icon"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/foreground.png" # transparente, ya con margen de zona segura
  adaptive_icon_foreground_inset: 0 # el margen ya está en la imagen
  adaptive_icon_monochrome: "assets/icons/monochrome.png" # Android 13+ iconos temáticos

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
